syntax = "proto3";

package io.deephaven.proto.controller;

import "deephaven_enterprise/proto/auth.proto";
import "deephaven_enterprise/proto/controller_common.proto";
import "deephaven_enterprise/proto/persistent_query.proto";

option java_multiple_files = true;
option optimize_for = SPEED;

// Controller API messages

message AuthenticationRequest {
  io.deephaven.proto.auth.Token token = 1;
  io.deephaven.proto.auth.ClientId clientId = 2;
  bool getConfiguration = 3;
}

message AuthenticationResponse {
  bool authenticated = 1;
  bytes cookie = 2;
  optional ControllerConfigurationMessage config = 3;
}

message AddQueryRequest {
  bytes cookie = 1;
  PersistentQueryConfigMessage config = 2;
}

message AddQueryResponse {
  int64 querySerial = 1;
}

message RemoveQueryRequest {
  bytes cookie = 1;
  int64 serial = 2;
}

message RemoveQueryResponse {
}

message ModifyQueryRequest {
  bytes cookie = 1;
  PersistentQueryConfigMessage config = 2;
  bool doRestart = 3;
}

message ModifyQueryResponse {

}

message ReplicaSpecifier {
  int64 serial = 1;
  oneof id {
    int32 replica = 2;
    int32 spare = 3;
  }
  optional string processInfoId = 4;
}

message ReplicaStatus {
  ReplicaSpecifier replica = 1;
  bool success = 2;
  optional string error = 3;
}

message RestartReplicaRequest {
  bytes cookie = 1;
  repeated ReplicaSpecifier replicas = 2;
}

message RestartReplicaResponse {
  repeated ReplicaStatus status = 1;
}

message StopReplicaRequest {
  bytes cookie = 1;
  repeated ReplicaSpecifier replicas = 2;
}

message StopReplicaResponse {
  repeated ReplicaStatus status = 1;
}

message RestartQueryRequest {
  bytes cookie = 1;
  repeated int64 serials = 2;
}

message RestartQueryResponse {
  repeated int64 successSerials = 1;
  map<int64, string> errorSerials = 2;
}

message StopQueryRequest {
  bytes cookie = 1;
  repeated int64 serials = 2;
}

message StopQueryResponse {
  repeated int64 successSerials = 1;
  map<int64, string> errorSerials = 2;
}

message DetermineDispatcherRequest {
  bytes cookie = 1;
  string serverGroupName = 2;
  int32 heapSizeMb = 3;
  string workerKind = 4;
}

enum ServerTypeEnum {
  STE_UNSPECIFIED = 0;
  STE_DISPATCHER = 1;
  STE_GROUP = 2;
}

message DetermineDispatcherResponse {
  PQDBServerConfigMessage serverConfig = 1;
}


message PQDBServerConfigMessage {
  string name = 1;
  string host = 2;
  int32 port = 3;
  optional string classPushListResourceName = 4;
  string serverClass = 5;
  double maxHeapSizeGb = 6;
  ServerTypeEnum serverType = 7;
  repeated string consoleGroups = 8;
  optional string serverInfo = 9;
}

message AssignmentPolicyConfigMessage {
  string name = 1;
  string displayName = 2;
  optional string description = 3;
  bool acceptsParameters = 4;
}

message GetConfigurationRequest {
  bytes cookie = 1;
}

message GetConfigurationResponse {
  ControllerConfigurationMessage config = 1;
}

message ControllerConfigurationMessage {
  int32 maxHeapSizeGb = 1;
  double minDataBufferPoolRatio = 2;
  double maxDataBufferPoolRatio = 3;
  repeated ConsoleConfigurationTypeMessage configurationTypes = 4;
  repeated ControllerTempQueueDetailsMessage temporaryQueueDetails = 5;
  string defaultTempQueueName = 6;
  repeated PQDBServerConfigMessage dbServers = 7;
  repeated string defaultSchedulingDetails = 8;
  int32 scheduleLookForwardDays = 9;
  bytes publicKey = 10;
  string algorithm = 11;
  repeated NamedStringList consoleServerGroups = 12;
  repeated string jvmProfileNames = 13;
  string defaultJvmProfileName = 14;
  string dataRoutingImplName = 15;
  repeated RoutingConfigMessage tdsConfigs = 16;
  repeated RoutingConfigMessage disConfigs = 17;
  repeated RoutingConfigMessage lasConfigs = 18;
  reserved "inWorkerServiceDetails";
  reserved 19; // inWorkerServiceDetails, removed in Grizzly
  repeated AssignmentPolicyConfigMessage assignmentPolicies = 20;
  string defaultAssignmentPolicyName = 21;
  string defaultAssignmentPolicyParams = 22;
}

message RoutingConfigMessage {
  string name = 1;
  repeated string tags = 2;
  string description = 3;
}

message ControllerTempQueueDetailsMessage {
  string name = 1;
  int32 maxConcurrentQueries = 2;
  int32 maxHeapMb = 3;
}

message ConsoleConfigurationTypeMessage {
  string name = 1;
  string displayName = 2;
  bool displayable = 3;
  map<string, string> properties = 4;
  bool hasScript = 5;
  repeated string serverClasses = 6;
  repeated string allowedGroups = 7;
  repeated ExtraColumnMessage extraColumns = 8;
  optional string typeSpecificWireConfigJSON = 9;

  string configCheckerClass = 10;
  string configPanelFactoryClass = 11;
  string customActionProviderClass = 12;
  string setupQueryClass = 13;
  string configClass = 14;
  string shutdownProcedureClass = 15;
  string extraJvmArgsClass = 16;
  string configProcessorClass = 17;
  string extraColumnGetterClass = 18;
  repeated string popupProviderClass = 19;
  string configTypeDetailsClass = 20;
  string communityInitializerClass = 21;
  bool hasScriptLanguage = 22;
  string communityRequestProcessorClass = 23;
  bool supportsReplicas=24;
}

message ExtraColumnMessage {
  string name = 1;
  string rendererName = 2;
}

enum ScriptCommandEnum {
  SCE_UNSPECIFIED = 0;
  SCE_GET_AS_SELF = 1;
  SCE_GET_AS_OTHER = 2;
  SCE_GET_FOR_QUERY = 3;
}

message ServerSelectionStatusRequest {
  bytes cookie = 1;
}

message ServerSelectionStatusResponse {
  string status = 1;
}

message ServerSelectionAdminRequest {
  bytes cookie = 1;
  string command = 2;
}

message ServerSelectionAdminResponse {
  string result = 1;
}

message GetScriptPathsRequest {
  bytes cookie = 1;
  ScriptCommandEnum command = 2;
  optional int64 querySerial = 3;
  optional string effectiveUser = 4;
  optional string scriptLoaderStateJSON = 5;
  bool useRelativePath = 6;
}

message GetScriptPathsResponse {
  repeated string results = 1;
}

message GetScriptRequest {
  bytes cookie = 1;
  ScriptCommandEnum command = 2;
  optional int64 querySerial = 3;
  optional string effectiveUser = 4;
  optional string scriptLoaderStateJSON = 5;
  string scriptPath = 6;
  bool useRelativePath = 7;
}

message GetScriptResponse {
  optional string scriptBody = 1;
}

message StatusUpdateRequest {
  bytes cookie = 1;
  int64 querySerial = 2;
  optional PersistentQueryStatusEnum status = 3;

  bool hasExportedObjects = 4;
  repeated ExportedObjectInfoMessage exportedObjects = 5;

  bool hasTableGroups = 6;
  repeated NamedStringList tableGroups = 7;
  string processInfoId = 8;
}

message StatusUpdateResponse {

}

message ReloadConfigRequest {
  bytes cookie = 1;
}

message ReloadConfigResponse {

}

enum SubscriptionEvent {
  SE_UNSPECIFIED = 0;
  SE_PUT = 1;
  SE_REMOVE = 2;
  SE_CONFIG_UPDATE = 3;
  SE_BATCH_END = 4;
}

// A single subscription filter element matching a Persistent Query (PQ) either
// by its serial, or by the combination of its owner and name.
//
// Exactly one of the variants below must be set. A filter element with neither
// variant set, or with an OwnerAndName where either field is empty, is malformed;
// servers that honor filters MUST reject such a request with INVALID_ARGUMENT.
message SubscriptionFilter {
  // The (owner, name) pair identifying a PQ. Both fields are required and must
  // be non-empty; specifying only one is malformed.
  message OwnerAndName {
    string owner = 1;
    string name = 2;
  }
  oneof match {
    // Match the PQ whose serial equals this value.
    int64 serial = 1;
    // Match the PQ whose (owner, name) equals this pair.
    OwnerAndName ownerAndName = 2;
  }
}

message SubscribeRequest {
  bytes cookie = 1;

  // Optional set of filters narrowing the subscription to a subset of the PQs
  // the client is otherwise allowed to see. Semantics:
  //
  //  - An empty list (the default) means "no filter": the subscription behaves
  //    as it did before this field was added and the client receives events for
  //    every PQ visible to it.
  //  - A non-empty list is OR-combined: a PQ matches the filter iff at least
  //    one element in the list matches it.
  //  - The visibility/ACL check is always implied, the filter can only
  //    further narrow the set; it can never widen visibility.
  //  - Filtering applies only to PQ-scoped events (SE_PUT and SE_REMOVE).
  //    SE_CONFIG_UPDATE and SE_BATCH_END are control/global events and are
  //    always delivered regardless of the filter.
  //  - The filter is re-evaluated on every PQ change. A PQ that transitions
  //    into the matching set (e.g. via rename or owner change when filtering
  //    by owner and name) is delivered as SE_PUT; a PQ that transitions out is
  //    delivered as SE_REMOVE. Servers track which serials have been delivered
  //    to a given subscription so that these enter/leave transitions are
  //    emitted exactly once.
  //  - Malformed filter elements (see SubscriptionFilter) MUST cause the RPC
  //    to fail with INVALID_ARGUMENT on servers that honor this field.
  //
  // Backwards-compatibility contract: a server MAY ignore this field (e.g. an
  // older server that predates filter support, where the unknown field is
  // silently dropped by proto3 parsing). Clients therefore MUST be prepared to
  // apply the same filter locally to the incoming stream to guarantee correct
  // behavior, including synthesizing the same enter/leave SE_PUT and SE_REMOVE
  // transitions described above against a fully unfiltered stream.
  repeated SubscriptionFilter filters = 2;
}

message SubscribeResponse {
  SubscriptionEvent event = 1;
  oneof data {
    // Only populated for SE_REMOVE
    int64 querySerial = 3;
    // Only populated for SE_PUT or SE_BATCH_END
    PersistentQueryInfoMessage queryInfo = 4;
    // Only populated for SE_CONFIG_UPDATE
    ControllerConfigurationMessage config = 5;
  }
}
