syntax = "proto3";

package io.deephaven.proto.config;

import "deephaven_enterprise/proto/common.proto";

option java_multiple_files = true;
option optimize_for = SPEED;

message GetFileRequest {
  string name = 1;
}

message GetFileResponse {
  string name = 1;
  bytes contentBytes = 2;
}

message GetAllFilesRequest {
}

message UpdateFileRequest {
  string name = 1;
  bytes contentBytes = 2;
  bool updateOnSameContents = 3;
}

message UpdateFileResponse {
}

message UpdateFilesRequest {
    repeated UpdateFileRequest updateFileRequest = 1;
}

// response to DeleteFilesRequest
message DeleteFilesResponse {
  // just success or an exception
}

// Delete one or more properties files
message DeleteFilesRequest {
    repeated string name = 1;
}